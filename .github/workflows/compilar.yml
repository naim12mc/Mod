
name: Compilar NAIMSAURIA 26.2

on:
  workflow_dispatch:
  push:

jobs:
  compilar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Compilar mod
        run: python3 fix_naimsauria_26_2.py && gradle build --stacktrace

      - name: Guardar JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NAIMSAURIA-26.2
          path: build/libs/*.jar
